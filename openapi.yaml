openapi: 3.1.0
info:
  title: bolobao
  version: 0.0.1
paths:
  /restaurants/search:
    get:
      operationId: searchRestaurants
      parameters:
        - name: q
          description: The search string to query
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: "#/components/schemas/restaurant"
                    type: array
                type: object
                required:
                  - data

        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"

        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"

  /restaurants/{id}/profile:
    post:
      operationId: createRestaurantProfile
      parameters:
        - name: id
          description: The restaurant to write a profile for
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        "200":
          description: >
            A stream of profileEvent JSON objects, one per stage, ending with
            done, refused or failed
          content:
            text/event-stream:
              schema:
                type: string

        "400":
          description: Invalid id parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"

        "404":
          description: Restaurant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"

        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"

        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"

        "503":
          description: Profile writer unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"

  /profiles:
    get:
      operationId: listProfiles
      parameters:
        - name: after
          description: A cursor for use in pagination
          in: query
          required: false
          schema:
            type: string
            format: uuid

        - name: limit
          description: A limit on the number of objects to be returned
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    items:
                      $ref: "#/components/schemas/restaurantProfile"
                    type: array
                type: object
                required:
                  - data

        "400":
          description: Invalid cursor or limit parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"

        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"

components:
  schemas:
    restaurant:
      type: object
      required: [id, name, category, address, area, lat, lon, has_profile]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        address:
          type: string
        area:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        has_profile:
          type: boolean

    restaurantProfile:
      type: object
      required:
        [
          id,
          name,
          category,
          address,
          area,
          lat,
          lon,
          price_level,
          photo_url,
          answers,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        address:
          type: string
        area:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        price_level:
          type: [integer, "null"]
          minimum: 1
          maximum: 4
        photo_url:
          type: string
        answers:
          type: array
          items:
            $ref: "#/components/schemas/answer"

    answer:
      type: object
      required: [prompt, text, source_url]
      properties:
        prompt:
          type: string
          enum:
            [
              best_dish,
              what_to_order_first,
              order_this_if_its_your_second_time,
              order_this_not_that,
              what_to_skip,
              known_for,
              portion_size,
              value_for_money,
              worth_the_queue,
              wait_time,
              busy,
              need_to_book,
              opening_hours,
              best_time,
              breakfast,
              service,
              how_old,
              cash_only,
              share_table,
              getting_there,
              spice_level,
              drinks,
              room_vibe,
            ]
        text:
          type: string
        source_url:
          type: string

    profileEvent:
      type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [read, wrote, checked, done, refused, failed]
        profile:
          $ref: "#/components/schemas/restaurantProfile"

    errorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            [
              INVALID_CURSOR,
              INVALID_LIMIT,
              INVALID_QUERY,
              INVALID_ID,
              NOT_FOUND,
              RATE_LIMITED,
              UNAVAILABLE,
              INTERNAL_ERROR,
            ]
        message:
          type: string
